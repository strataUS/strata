<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strata Client</title>

<style>
:root{
    --red:#ff2b2b;
    --dark:#050505;
    --card:#0d0d0d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--dark);
    color:white;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    backdrop-filter:blur(15px);
    background:rgba(0,0,0,.75);
    border-bottom:1px solid rgba(255,43,43,.15);
}

.nav-container{
    max-width:1400px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    width:44px;
    height:44px;
    border:2px solid var(--red);
    border-radius:12px;
}

.links{
    display:flex;
    gap:30px;
}

.links a{
    text-decoration:none;
    color:white;
    transition:.3s;
}

.links a:hover{
    color:var(--red);
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:800px;
    height:800px;
    background:radial-gradient(
        circle,
        rgba(255,0,0,.2),
        transparent 70%
    );
}

.hero-content{
    z-index:2;
    width:90%;
    max-width:1000px;
}

.hero-logo{
    width:180px;
    height:180px;
    margin:auto;
    border:3px solid var(--red);
    border-radius:24px;
    margin-bottom:30px;
    overflow:hidden;
}

.hero-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-title{
    height:70px;
    border:2px dashed var(--red);
    margin-bottom:20px;
    border-radius:12px;
}

.hero-text{
    height:110px;
    border:2px dashed #772020;
    margin-bottom:35px;
    border-radius:12px;
}

/* DOWNLOAD DROPDOWN */

.download-dropdown{
    position:relative;
    display:inline-block;
}

.download-btn{
    background:var(--red);
    color:white;
    border:none;
    padding:16px 40px;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

.download-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(255,0,0,.7);
}

.dropdown-content{
    display:none;
    position:absolute;
    left:0;
    top:110%;
    min-width:220px;
    background:#121212;
    border:1px solid var(--red);
    border-radius:14px;
    overflow:hidden;
}

.dropdown-content a{
    display:block;
    text-decoration:none;
    color:white;
    padding:14px;
    transition:.25s;
}

.dropdown-content a:hover{
    background:var(--red);
}

.download-dropdown:hover .dropdown-content{
    display:block;
}

/* DIVIDER */

.divider{
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--red),
        transparent
    );
}

/* SECTIONS */

section{
    padding:100px 10%;
}

.section-header{
    width:300px;
    height:45px;
    border:2px dashed var(--red);
    margin:auto;
    margin-bottom:50px;
    border-radius:12px;
}

/* FEATURES */

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.feature-card{
    background:var(--card);
    border:1px solid rgba(255,43,43,.2);
    border-radius:18px;
    padding:30px;
    transition:.3s;
}

.feature-card:hover{
    transform:translateY(-8px);
    border-color:var(--red);
}

.icon{
    width:60px;
    height:60px;
    border:2px solid var(--red);
    border-radius:12px;
    margin-bottom:20px;
}

.feature-placeholder{
    height:80px;
    border:2px dashed #702020;
    border-radius:12px;
}

/* SCREENSHOTS */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.shot{
    height:220px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,43,43,.2);
    background:#111;
}

.shot img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.stat{
    padding:40px;
    border-radius:18px;
    background:var(--card);
    border:1px solid rgba(255,43,43,.2);
    text-align:center;
}

.number{
    width:100px;
    height:40px;
    border:2px dashed var(--red);
    margin:auto auto 15px;
}

.label{
    width:120px;
    height:18px;
    border:2px dashed #702020;
    margin:auto;
}

/* DOWNLOAD PANEL */

.download-section{
    max-width:900px;
    margin:auto;
    background:linear-gradient(
        180deg,
        rgba(255,0,0,.15),
        rgba(255,0,0,.03)
    );
    padding:60px;
    border-radius:22px;
    border:1px solid rgba(255,43,43,.2);
    text-align:center;
}

.download-title{
    width:300px;
    height:45px;
    border:2px dashed var(--red);
    margin:auto auto 30px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:50px;
    color:#777;
}

@media(max-width:700px){

.links{
    display:none;
}

.hero-logo{
    width:140px;
    height:140px;
}

}
</style>
</head>
